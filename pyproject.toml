[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-lab"
version = "0.1.0"
description = "Task-targeted agent memory with worktree-scoped harness hooks"
requires-python = ">=3.11"

[project.scripts]
context-lab = "context_lab.__main__:main"

[tool.setuptools]
packages = ["context_lab"]
